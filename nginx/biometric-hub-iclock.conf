# Biometric Hub — ADMS / iclock endpoints
#
# Push-mode ZKTeco readers connect to fixed paths and cannot be told to use a
# different URL shape. This maps those paths onto the app's handlers.
#
# ---------------------------------------------------------------------------
# INSTALLING THIS IS A DELIBERATE ACT, NOT A STEP IN A SCRIPT.
#
# Never run `bench setup nginx` on this server: it regenerates the whole
# configuration and would destroy the existing SSL/certbot blocks for the
# production site. This file is additive, and belongs in /etc/nginx/conf.d/
# only after `nginx -t` passes and someone has agreed to the reload.
#
# The protocol authenticates with nothing but a serial number in the query
# string. Restrict it by source IP — the `allow`/`deny` block below — to the
# networks your readers actually sit on. Without that, anyone who can reach the
# endpoint and guesses a serial can post attendance.
# ---------------------------------------------------------------------------

location /iclock/ {
    # Replace with the customer's site network(s).
    # allow 203.0.113.0/24;
    # deny  all;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Readers are slow and chatty; do not make them fight a short timeout.
    proxy_read_timeout 120s;
    client_max_body_size 5m;

    rewrite ^/iclock/cdata(.*)$      /api/method/biometric_hub.api.adms.cdata$1      break;
    rewrite ^/iclock/getrequest(.*)$ /api/method/biometric_hub.api.adms.getrequest$1 break;
    rewrite ^/iclock/devicecmd(.*)$  /api/method/biometric_hub.api.adms.devicecmd$1  break;

    proxy_pass http://127.0.0.1:8001;   # this bench's webserver_port
}
